<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑계의 정석 - 맞춤형 핑계 추천기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6C5CE7;
            --primary-hover: #5B4BC4;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-sub: #636E72;
            --accent-color: #FF7675;
            --border-color: #DFE6E9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            transition: all 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header .icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        label .req {
            color: var(--accent-color);
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #FAFAFA;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            background-color: #FFF;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        .tone-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .tone-btn {
            padding: 12px;
            border: 1.5px solid var(--border-color);
            background: #FAFAFA;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            transition: all 0.2s ease;
        }

        .tone-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tone-btn.active {
            background: rgba(108, 92, 231, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 700;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #EFEFEF;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Section */
        .result-section {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed var(--border-color);
            padding-top: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .excuse-card {
            background: #F4F3FF;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .excuse-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #2D3436;
            font-weight: 500;
            margin-bottom: 12px;
            word-break: keep-all;
        }

        .excuse-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .success-rate {
            background: #E0DFFF;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: 1.5px solid var(--border-color);
            background: white;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #F8F9FA;
            border-color: #B2BEC3;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2D3436;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .tone-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="icon">🚨</span>
        <h1>핑계의 정석</h1>
        <p>난감한 상황에 직면하셨나요? 최적의 핑계를 찾아드립니다.</p>
    </header>

    <form id="excuseForm" onsubmit="generateExcuse(event)">
        <!-- 1. 잘못한 내용 -->
        <div class="form-group">
            <label for="action">어떤 상황인가요? (실수/잘못한 내용) <span class="req">*</span></label>
            <input type="text" id="action" placeholder="예: 약속 시간에 1시간 늦음, 보고서 제출 기한 넘김" required>
        </div>

        <!-- 2. 상대방 -->
        <div class="form-group">
            <label for="target">누구에게 댈 핑계인가요? <span class="req">*</span></label>
            <select id="target" required>
                <option value="" disabled selected>상대방을 선택하세요</option>
                <option value="boss">직장 상사 / 팀장님</option>
                <option value="friend">친한 친구</option>
                <option value="partner">연인 / 배우자</option>
                <option value="professor">교수님 / 선생님</option>
                <option value="parents">부모님</option>
                <option value="client">거래처 / 고객</option>
            </select>
        </div>

        <!-- 3. 장소 -->
        <div class="form-group">
            <label for="location">어디서 발생한 상황인가요? <span class="req">*</span></label>
            <input type="text" id="location" placeholder="예: 카페, 회사, 학교, 약속장소로 이동 중" required>
        </div>

        <!-- 4. 핑계 톤 & 매너 -->
        <div class="form-group">
            <label>핑계 스타일 (톤앤매너)</label>
            <div class="tone-options">
                <div class="tone-btn active" onclick="selectTone('sincere', this)">🙏 맹렬한 반성형</div>
                <div class="tone-btn" onclick="selectTone('creative', this)">🌀 창의적 불가항력형</div>
                <div class="tone-btn" onclick="selectTone('humorous', this)">🤪 능청스러운 유머형</div>
            </div>
        </div>

        <button type="submit" class="submit-btn">최적의 핑계 생성하기 ✨</button>
    </form>

    <!-- 로딩 애니메이션 -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="font-size:0.9rem; color:var(--text-sub);">AI 핑계 알고리즘이 가동 중입니다...</p>
    </div>

    <!-- 결과 영역 -->
    <div class="result-section" id="resultSection">
        <div class="result-title">
            💡 상황에 맞는 추천 핑계
        </div>
        
        <div class="excuse-card">
            <div class="excuse-text" id="resultText"></div>
            <div class="excuse-meta">
                <span>추천 스타일: <strong id="selectedToneText">맹렬한 반성형</strong></span>
                <span class="success-rate" id="successRate">위기 회피율 88%</span>
            </div>
        </div>

        <div class="action-btns">
            <button class="action-btn" onclick="copyResult()">📋 텍스트 복사</button>
            <button class="action-btn" onclick="generateExcuse(event)">🔄 다른 핑계 보기</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">핑계가 클립보드에 복사되었습니다!</div>

<script>
    let currentTone = 'sincere';

    function selectTone(tone, element) {
        currentTone = tone;
        document.querySelectorAll('.tone-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function copyResult() {
        const text = document.getElementById('resultText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            showToast('핑계가 클립보드에 복사되었습니다!');
        });
    }

    function generateExcuse(event) {
        if(event) event.preventDefault();

        const action = document.getElementById('action').value.trim();
        const targetSelect = document.getElementById('target');
        const targetText = targetSelect.options[targetSelect.selectedIndex].text;
        const targetVal = targetSelect.value;
        const location = document.getElementById('location').value.trim();

        if (!action || !targetVal || !location) {
            alert('모든 필드를 입력해주세요!');
            return;
        }

        // 로딩 표시
        document.getElementById('resultSection').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';

            const excuse = buildExcuse(action, targetVal, targetText, location, currentTone);
            document.getElementById('resultText').innerText = excuse.text;
            document.getElementById('successRate').innerText = `위기 회피율 ${excuse.rate}%`;
            
            const toneMap = {
                'sincere': '맹렬한 반성형',
                'creative': '창의적 불가항력형',
                'humorous': '능청스러운 유머형'
            };
            document.getElementById('selectedToneText').innerText = toneMap[currentTone];
            
            // 결과창으로 스크롤
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }, 600);
    }

    function buildExcuse(action, targetVal, targetText, location, tone) {
        let text = "";
        let rate = Math.floor(Math.random() * 20) + 75; // 75~95%

        if (tone === 'sincere') {
            if (targetVal === 'boss' || targetVal === 'client') {
                text = `정말 죄송합니다. [${location}]에서 [${action}] 관련하여 최종 검토 및 마무리를 진행하다 뜻밖의 차질이 생겼습니다. 이유 여하를 불문하고 제 미흡함 때문입니다. 지금 즉시 복구하고 처리하여 보고드리겠습니다. 너그럽게 양해해 주신다면 신속히 수습하겠습니다.`;
            } else if (targetVal === 'professor') {
                text = `교수님, 정말 죄송합니다. [${location}]에서 [${action}] 상황에 대해 준비하는 과정에서 예상치 못한 신호 오류 및 전달 누락이 있었습니다. 제 세심함이 부족했습니다. 변명의 여지없이 깊이 반성하고 있으며, 제출/수정 건은 빠르게 보완해서 전달드리겠습니다.`;
            } else if (targetVal === 'partner' || targetVal === 'friend') {
                text = `정말 미안해... [${location}]에 도착해서 [${action}] 건 때문에 일이 완전히 꼬여버렸어. 전부 내 불찰이야. 많이 답답하고 화났을 텐데 너무 미안해. 지금 가면서 바로 상황 설명하고 수습할게, 한 번만 너그럽게 봐줘!`;
            } else {
                text = `정말 죄송해요. [${location}]에서 [${action}] 일로 인해 예기치 않은 지연이 발생했습니다. 제 실수가 큽니다. 바로 정리하고 연락드리겠습니다!`;
            }
        } 
        else if (tone === 'creative') {
            if (targetVal === 'boss' || targetVal === 'client') {
                text = `[${location}] 현장에서 갑작스러운 시스템 통신 장애 및 외부 변수로 인해 [${action}] 건 처리에 불가피한 지연이 생겼습니다. 현장 제어가 불가능했던 상황이라 빠른 2차 대안을 마련 중입니다. 신속하게 완료 후 즉시 보고드리겠습니다!`;
            } else if (targetVal === 'partner' || targetVal === 'friend') {
                text = `아니 진짜 말도 안 되는 일이 터졌어! [${location}] 근처에서 [${action}] 와중에 갑자기 휴대폰 먹통+배터리 방전에 도로까지 통제돼서 완전히 갇혀버렸어... 우주가 날 억까하는 수준이었지만 어떻게든 탈출해서 수습 중이야!`;
            } else {
                text = `[${location}]에서 [${action}] 진행 도중, 제 의지와 상관없는 갑작스러운 네트워크 장애와 외부 인원의 돌발 행동으로 인해 상황이 꼬였습니다. 현장 정리되는 대로 즉시 복귀하겠습니다.`;
            }
        } 
        else if (tone === 'humorous') {
            if (targetVal === 'partner' || targetVal === 'friend') {
                text = `혹시 타임머신 어디서 파는지 아시나요...? 😭 [${location}]에서 [${action}] 하다가 시공간의 폭풍에 휘말렸습니다... 맛있는 거 사들고 갈 테니 제발 살려주세요! 바로 달려가는 중!`;
            } else {
                text = `[${location}]에서 [${action}] 건을 해결하려다가 지구 평화를 위협받는(?) 거대한 사건에 휘말렸습니다... 빠르게 수습 완료했으니 너그러운 인내심으로 헤아려주시면 평생 충성을 다하겠습니다!`;
            }
        }

        return { text, rate };
    }
</script>

</body>
</html>
